version: '3.8'

networks:
  lurenet-network:
    driver: bridge

volumes:
  esdata:

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: lurenet-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - lurenet-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: lurenet-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - lurenet-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: lurenet-logstash
    volumes:
      - ./elk/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "8080:8080"
    depends_on:
      - elasticsearch
    networks:
      - lurenet-network
